// ---------- LOCAIS DE COMPRA ----------
// Cada item do catálogo pode ter o preço cotado em vários fornecedores.
// Quem monta a proposta escolhe de onde comprar.
const LOCAIS_PADRAO = ['Dimensional', 'Bahia Tech', 'Nova Bahia'];
const normalizar = txt => String(txt || '').trim().toLowerCase();

// Tira acentos, para "flexivel" achar "Flexível" e "acucar" achar "açúcar"
const semAcento = txt => String(txt || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

// Busca por várias palavras-chave, em qualquer ordem: cada palavra digitada
// precisa aparecer em algum lugar do texto do item (descrição, marca ou
// local de compra). Ex: "6mm cabo flexivel" acha
// "[CONDUTOR] Cabo Flexível 750V 70G PVC 6MM² Verde".
const combinaBusca = (textoDoItem, busca) => {
  const palavras = semAcento(busca).split(/\s+/).filter(Boolean);
  if (palavras.length === 0) return true;
  const alvo = semAcento(textoDoItem);
  return palavras.every(p => alvo.includes(p));
};

// Junta tudo que é pesquisável de um item num texto só
const textoBuscavel = item => {
  const locaisDoItem = (item.precos || []).map(p => p.local || '').join(' ');
  return `${item.descricao || ''} ${item.marca || ''} ${locaisDoItem}`;
};

    const ok = await salvarDado(CHAVE_LOCAIS, lista);
    avisar(ok ? 'sucesso' : 'erro', ok ? `Local "${nome}" removido.` : 'Não consegui salvar a alteração.');
  };
  const salvarListaPropostas = async lista => {
    const carimbado = carimbarMudancas(lista, propostas, 'id');
    setPropostas(carimbado);
    const ok = await salvarDado(CHAVE_PROPOSTAS, carimbado);
    setErroStorage(!ok);
    atualizarPendencias();
    return ok;
  };

  // Mostra um aviso fixo na tela (não usa alert do navegador, que pode
  // ficar bloqueado depois de vários cliques seguidos).
  const avisar = (tipo, texto) => {
    setMensagem({
      tipo,
      texto
    });
    setTimeout(() => {
      setMensagem(atual => atual && atual.texto === texto ? null : atual);
    }, 4000);
  };

  // Confirmação em dois toques: primeiro toque arma, segundo toque (em até
  // 4s) executa a ação. Substitui o window.confirm, que também pode ficar
  // bloqueado pelo navegador.
  const pedirConfirmacao = (chave, acao) => {
    if (confirmando === chave) {
      setConfirmando(null);
      acao();
    } else {
      setConfirmando(chave);
      setTimeout(() => {
        setConfirmando(atual => atual === chave ? null : atual);
      }, 4000);
    }
  };

  // ---------- CATÁLOGO ----------
  const gerarIdInterno = () => `item-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
  const adicionarItem = () => {
    if (!novo.descricao.trim() || !novo.preco) {
      avisar('erro', 'Preencha descrição e preço.');
      return;
    }
    const item = {
      codigo: gerarIdInterno(),
      marca: novo.marca.trim(),
      descricao: novo.descricao.trim(),
      preco: parseFloat(novo.preco),
      unidade: novo.unidade,
      estoque: 0,
      precos: [{
        local: novo.local,
        preco: parseFloat(novo.preco),
        data: hoje()
      }],
      data: hoje()
    };
    salvarCatalogo([item, ...catalogo]);
    setNovo({
      marca: '',
      descricao: '',
      preco: '',
      unidade: 'm',
      local: novo.local
    });
    setFiltro('');
    setDestaque(item.codigo);
    avisar('sucesso', `Item "${item.descricao}" adicionado ao catálogo.`);
    setTimeout(() => setDestaque(null), 3000);
  };
  const abrirEdicao = item => {
    const it = migrarItem(item);
    setEditando(item.codigo);
    setEdit({
      marca: it.marca || '',
      descricao: it.descricao,
      unidade: it.unidade,
      estoque: String(it.estoque || 0),
      // Sempre mostra os 3 fornecedores, preenchendo os que já têm cotação
      precos: locais.map(local => {
        const achado = (it.precos || []).find(p => p.local === local);
        return {
          local,
          preco: achado ? String(achado.preco) : '',
          data: achado ? achado.data : ''
        };
      })
    });
  };
  const mudarPrecoEdit = (local, valor) => setEdit({
    ...edit,
    precos: edit.precos.map(p => p.local === local ? {
      ...p,
      preco: valor
    } : p)
  });
  const salvarEdicao = () => {
    const precosValidos = edit.precos.filter(p => p.preco !== '' && parseFloat(p.preco) > 0).map(p => ({
      local: p.local,
      preco: parseFloat(p.preco),
      data: p.data || hoje()
    }));
    if (!edit.descricao.trim()) {
      avisar('erro', 'Preencha a descrição do item.');
      return;
    }
    salvarCatalogo(catalogo.map(i => {
      if (i.codigo !== editando) return i;
      const antigos = migrarItem(i).precos || [];
      // Só carimba data nova nos preços que realmente mudaram
      const precos = precosValidos.map(p => {
        const antigo = antigos.find(a => a.local === p.local);
        return antigo && Number(antigo.preco) === p.preco ? antigo : {
          ...p,
          data: hoje()
        };
      });
      return {
        ...i,
        marca: edit.marca.trim(),
        descricao: edit.descricao.trim(),
        unidade: edit.unidade,
        estoque: parseFloat(edit.estoque) || 0,
        precos,
        preco: maisBarato({
          precos
        }).preco,
        data: hoje()
      };
    }));
    setEditando(null);
    avisar('sucesso', 'Item atualizado.');
  };

  // ---------- ESTOQUE ----------
  const mudarEstoque = (codigo, valor) => salvarCatalogo(catalogo.map(i => i.codigo === codigo ? {
    ...i,
    estoque: Math.max(0, parseFloat(valor) || 0)
  } : i));

  // Desconta do estoque a quantidade que o usuário decidiu usar deste item.
  const darBaixa = codigo => {
    const item = planoCompras.find(p => p.codigo === codigo);
    if (!item) return;
    const usar = item.usarDoEstoque;
    if (usar <= 0) {
      avisar('erro', 'Este item está marcado para não usar estoque.');
      return;
    }
    salvarCatalogo(catalogo.map(c => c.codigo === codigo ? {
      ...c,
      estoque: (Number(c.estoque) || 0) - usar
    } : c));
    // Fixa a quantidade usada, para a baixa não "sumir" quando o estoque zerar
    setProposta(proposta.map(p => p.codigo === codigo ? {
      ...p,
      baixado: true,
      usarEstoque: usar
    } : p));
    avisar('sucesso', `Baixa de ${usar} ${item.unidade} no estoque.`);
  };
  const deletarItem = codigo => {
    salvarCatalogo(catalogo.filter(i => i.codigo !== codigo));
    avisar('sucesso', 'Item excluído do catálogo.');
  };

  // ---------- IMPORTAÇÃO POR LISTA COLADA ----------
  // O app não chama nenhuma IA sozinho (isso exigiria uma chave de API
  // exposta publicamente, o que não é seguro). Em vez disso, o usuário manda
  // a foto/PDF direto pro Claude no chat, o Claude devolve uma lista em JSON,
  // e essa lista é colada aqui para revisão antes de entrar no catálogo.
  const processarTextoColado = () => {
    if (!textoColado.trim()) {
      avisar('erro', 'Cole a lista que o Claude te enviou no chat.');
      return;
    }
    setImportando(true);
    try {
      const limpo = textoColado.trim().replace(/```json|```/g, '').trim();
      const extraidos = JSON.parse(limpo);
      if (!Array.isArray(extraidos) || extraidos.length === 0) {
        avisar('erro', 'Não encontrei itens nesse texto. Confira se colou a lista completa, sem cortar nada.');
        setImportando(false);
        return;
      }
      const paraRevisao = extraidos.filter(it => it && it.descricao).map((it, idx) => {
        const descricaoNorm = String(it.descricao || '').trim().toLowerCase();
        const existente = catalogo.find(c => c.descricao.trim().toLowerCase() === descricaoNorm);
        // Compara com o preço já cotado NESTE fornecedor (se houver)
        const cotacaoLocal = existente ? (migrarItem(existente).precos || []).find(p => p.local === localImportacao) : null;
        return {
          chaveTemp: `imp-${idx}-${Date.now()}`,
          marca: String(it.marca || '').trim(),
          descricao: String(it.descricao || '').trim(),
          preco: parseFloat(it.preco) || 0,
          precoNovo: parseFloat(it.preco) || 0,
          unidade: it.unidade === 'm' ? 'm' : 'Un',
          status: existente ? 'atualizacao' : 'novo',
          codigoExistente: existente ? existente.codigo : null,
          precoAntigo: cotacaoLocal ? Number(cotacaoLocal.preco) : null,
          incluir: true
        };
      });
      if (paraRevisao.length === 0) {
        avisar('erro', 'Não encontrei itens válidos nesse texto.');
        setImportando(false);
        return;
      }
      setRevisao(paraRevisao);
      setTextoColado('');
      avisar('sucesso', `${paraRevisao.length} item(ns) encontrado(s). Confira antes de adicionar.`);
    } catch (err) {
      avisar('erro', 'Não consegui entender esse texto. Confira se é exatamente a lista que o Claude te mandou, sem alterações.');
    } finally {
      setImportando(false);
    }
  };
  const mudarItemRevisao = (chaveTemp, campo, valor) => setRevisao(revisao.map(r => r.chaveTemp === chaveTemp ? {
    ...r,
    [campo]: valor
  } : r));
  const confirmarImportacao = () => {
    const selecionados = revisao.filter(r => r.incluir && r.descricao.trim() && r.preco > 0);
    if (selecionados.length === 0) {
      avisar('erro', 'Marque ao menos um item com descrição e preço válidos.');
      return;
    }
    let novoCatalogo = [...catalogo];
    selecionados.forEach(r => {
      const idx = r.codigoExistente ? novoCatalogo.findIndex(c => c.codigo === r.codigoExistente) : -1;
      const precoNum = parseFloat(r.preco) || 0;
      const local = localImportacao;
      const existente = idx >= 0 ? migrarItem(novoCatalogo[idx]) : null;

      // Atualiza só o preço do fornecedor da lista importada; os outros
      // fornecedores já cotados continuam intactos.
      const outros = existente ? (existente.precos || []).filter(p => p.local !== local) : [];
      const precos = [...outros, {
        local,
        preco: precoNum,
        data: hoje()
      }];
      const itemFinal = {
        codigo: r.codigoExistente || gerarIdInterno(),
        marca: r.marca.trim(),
        descricao: r.descricao.trim(),
        unidade: r.unidade,
        estoque: existente ? existente.estoque || 0 : 0,
        precos,
        preco: maisBarato({
          precos
        }).preco,
        data: hoje()
      };
      if (idx >= 0) {
        novoCatalogo[idx] = itemFinal;
      } else {
        novoCatalogo = [itemFinal, ...novoCatalogo];
      }
    });
    salvarCatalogo(novoCatalogo);
    avisar('sucesso', `${selecionados.length} item(ns) adicionados/atualizados no catálogo.`);
    setRevisao(null);
  };
  const cancelarImportacao = () => setRevisao(null);

  // ---------- PROPOSTA ----------
  const addProposta = item => {
    const existe = proposta.find(p => p.codigo === item.codigo);
    if (existe) {
      setProposta(proposta.map(p => p.codigo === item.codigo ? {
        ...p,
        quantidade: p.quantidade + 1
      } : p));
    } else {
      const it = migrarItem(item);
      const barato = maisBarato(it);
      // usarEstoque = null significa "usar o máximo que tiver"
      setProposta([...proposta, {
        ...it,
        quantidade: 1,
        usarEstoque: null,
        compras: null,
        localEscolhido: barato.local,
        baixado: false
      }]);
    }
    setAba('proposta');
  };
  const mudarQtd = (codigo, qtd) => setProposta(proposta.map(p => p.codigo === codigo ? {
    ...p,
    quantidade: qtd
  } : p));
  const tirarDaProposta = codigo => setProposta(proposta.filter(p => p.codigo !== codigo));

  // Define a quantidade direto pelo catálogo, sem sair da aba.
  // Se o item ainda não está na proposta, entra; se a quantidade cair a zero, sai.
  const definirQtdCatalogo = (item, valor) => {
    const qtd = Math.max(0, parseFloat(valor) || 0);
    const existe = proposta.find(p => p.codigo === item.codigo);
    if (qtd === 0) {
      if (existe) tirarDaProposta(item.codigo);
      return;
    }
    if (existe) {
      mudarQtd(item.codigo, qtd);
    } else {
      const it = migrarItem(item);
      const barato = maisBarato(it);
      setProposta([...proposta, {
        ...it,
        quantidade: qtd,
        usarEstoque: null,
        compras: null,
        localEscolhido: barato.local,
        baixado: false
      }]);
    }
  };

  // Estoque atual (vem do catálogo, que é onde a baixa é gravada)
  const estoqueDe = codigo => {
    const c = catalogo.find(x => x.codigo === codigo);
    return Number(c && c.estoque) || 0;
  };

  // Quanto deste item sai do estoque (o usuário pode reduzir ou zerar)
  const mudarUsarEstoque = (codigo, valor) => setProposta(proposta.map(p => p.codigo === codigo ? {
    ...p,
    usarEstoque: Math.max(0, parseFloat(valor) || 0)
  } : p));

  // Grava as linhas de compra (uma por loja) do item
  const definirLinhas = (codigo, linhas) => setProposta(proposta.map(p => p.codigo === codigo ? {
    ...p,
    compras: linhas
  } : p));
  const mudarLinha = (codigo, linhasAtuais, idx, campo, valor) => {
    const novas = linhasAtuais.map((l, i) => i === idx ? {
      ...l,
      [campo]: campo === 'qtd' ? Math.max(0, parseFloat(valor) || 0) : valor
    } : l);
    definirLinhas(codigo, novas);
  };

  // Divide a compra deste item em mais uma loja
  const dividirCompra = (codigo, linhasAtuais, locaisDoItem) => {
    const jaUsados = linhasAtuais.map(l => l.local);
    const livre = locaisDoItem.find(l => !jaUsados.includes(l)) || locaisDoItem[0];
    definirLinhas(codigo, [...linhasAtuais, {
      local: livre,
      qtd: 0
    }]);
  };
  const removerLinha = (codigo, linhasAtuais, idx) => {
    const novas = linhasAtuais.filter((_, i) => i !== idx);
    definirLinhas(codigo, novas.length > 0 ? novas : null);
  };
  const editarServico = (codigo, campo, valor) => setServicos(servicos.map(s => s.codigo === codigo ? {
    ...s,
    [campo]: parseFloat(valor) || 0
  } : s));

  // ---------- ESTOQUE x COMPRAS ----------
  // Para cada item: quanto sai do estoque e como o restante é comprado
  // (podendo ser dividido entre várias lojas).
  const planoCompras = proposta.map(guardado => {
    // Os preços e lojas vêm SEMPRE do catálogo, nunca da cópia guardada no
    // item da proposta. Sem isso, editar o cadastro depois de montar a
    // proposta não teria efeito (o item ficaria com a cotação antiga).
    const noCatalogo = catalogo.find(c => c.codigo === guardado.codigo);
    const base = migrarItem(noCatalogo || guardado);
    const p = {
      ...base,
      quantidade: guardado.quantidade,
      usarEstoque: guardado.usarEstoque,
      compras: guardado.compras,
      localEscolhido: guardado.localEscolhido,
      baixado: guardado.baixado
    };
    const emEstoque = Number(base.estoque) || 0;
    // usarEstoque null = "usar o máximo disponível"; o usuário pode reduzir/zerar
    const pedido = p.usarEstoque === null || p.usarEstoque === undefined ? emEstoque : Number(p.usarEstoque) || 0;
    const usarDoEstoque = Math.max(0, Math.min(pedido, emEstoque, p.quantidade));
    const comprar = Math.max(0, p.quantidade - usarDoEstoque);
    const locaisDoItem = (p.precos || []).map(pr => pr.local);
    // Se a loja escolhida deixou de ter cotação, cai para a mais barata
    const localValido = l => locaisDoItem.includes(l) ? l : maisBarato(p).local;
    let linhas;
    if (p.compras && p.compras.length > 0) {
      linhas = p.compras.map(l => ({
        local: localValido(l.local),
        qtd: Number(l.qtd) || 0
      }));
      // Com uma linha só, ela sempre acompanha o que falta comprar
      if (linhas.length === 1) linhas[0].qtd = comprar;
    } else {
      linhas = [{
        local: localValido(p.localEscolhido || maisBarato(p).local),
        qtd: comprar
      }];
    }
    const somaLinhas = linhas.reduce((s, l) => s + l.qtd, 0);
    const diferenca = comprar - somaLinhas; // >0 falta distribuir, <0 passou

    const precoEstoque = maisBarato(p).preco;
    const custoCompra = linhas.reduce((s, l) => s + l.qtd * precoNoLocal(p, l.local), 0);
    const custoItem = usarDoEstoque * precoEstoque + custoCompra;
    return {
      ...p,
      emEstoque,
      usarDoEstoque,
      comprar,
      linhas,
      locaisDoItem,
      somaLinhas,
      diferenca,
      custoCompra,
      custoItem,
      precoEstoque
    };
  });
  const itensAComprar = planoCompras.filter(p => p.comprar > 0);
  const totalCompras = planoCompras.reduce((s, p) => s + p.custoCompra, 0);

  // Avisa se alguma divisão de compra não fecha com a quantidade necessária
  const divisoesInvalidas = planoCompras.filter(p => p.diferenca !== 0);

  // Agrupa por loja, considerando cada linha de compra separadamente
  const comprasPorLocal = {};
  planoCompras.forEach(p => {
    p.linhas.forEach(l => {
      if (l.qtd <= 0) return;
      if (!comprasPorLocal[l.local]) comprasPorLocal[l.local] = {
        itens: [],
        total: 0
      };
      const custo = l.qtd * precoNoLocal(p, l.local);
      comprasPorLocal[l.local].itens.push({
        ...p,
        comprarNesta: l.qtd,
        custoNesta: custo
      });
      comprasPorLocal[l.local].total += custo;
    });
  });

  // Itens na proposta que ainda não têm preço: entrariam somando R$ 0,00
  const itensSemCotacao = planoCompras.filter(p => semCotacao(p));

  // ---------- CÁLCULOS ----------
  const totalItens = planoCompras.reduce((s, p) => s + p.custoItem, 0);
  const totalServicos = servicos.reduce((s, srv) => s + srv.valorDiario * srv.dias, 0);
  const subtotal = totalItens + totalServicos;
  const valorBdi = subtotal * (bdi / 100);
  const totalFinal = subtotal + valorBdi;

  // ---------- HISTÓRICO ----------
  const salvarProposta = async () => {
    if (!numProposta.trim()) return avisar('erro', 'Dê um número/nome para a proposta.');
    if (proposta.length === 0 && totalServicos === 0) return avisar('erro', 'Adicione itens ou serviços.');
    const nova = {
      id: Date.now(),
      numero: numProposta.trim(),
      cliente: cliente.trim(),
      endereco: endereco.trim(),
      tipoServico: tipoServico.trim(),
      data: agora(),
      itens: proposta,
      servicos: servicos.filter(s => s.dias > 0),
      bdi,
      subtotal,
      totalFinal
    };
    const lista = [nova, ...propostas];
    const ok = await salvarListaPropostas(lista);
    if (ok) {
      avisar('sucesso', `✅ Proposta "${nova.numero}" salva. Veja na lista "Propostas salvas" abaixo.`);
    } else {
      avisar('erro', 'A proposta ficou salva nesta tela, mas houve um problema ao gravar de forma permanente. Exporte o CSV como garantia.');
    }
  };
  const abrirProposta = p => {
    setNumProposta(p.numero || '');
    setCliente(p.cliente || '');
    setEndereco(p.endereco || '');
    setTipoServico(p.tipoServico || '');
    // Reconecta cada item ao catálogo, para os seletores de loja voltarem a
    // funcionar mesmo em propostas antigas (salvas antes dessa funcionalidade).
    setProposta((p.itens || []).map(salvo => {
      const noCatalogo = catalogo.find(c => c.codigo === salvo.codigo);
      const base = noCatalogo ? migrarItem(noCatalogo) : migrarItem(salvo);
      return {
        ...base,
        quantidade: salvo.quantidade,
        usarEstoque: salvo.usarEstoque !== undefined ? salvo.usarEstoque : null,
        compras: salvo.compras || null,
        localEscolhido: salvo.localEscolhido || maisBarato(base).local,
        baixado: !!salvo.baixado
      };
    }));
    setServicos(SERVICOS_INICIAL.map(s => {
      const salvo = (p.servicos || []).find(x => x.codigo === s.codigo);
      return salvo ? {
        ...s,
        ...salvo
      } : s;
    }));
    setBdi(p.bdi || 0);
    setAba('proposta');
  };
  const excluirProposta = async id => {
    const lista = propostas.filter(p => p.id !== id);
    await salvarListaPropostas(lista);
    avisar('sucesso', 'Proposta excluída.');
  };
  const novaPropostaAcao = () => {
    setNumProposta('');
    setCliente('');
    setEndereco('');
    setTipoServico('');
    setProposta([]);
    setServicos(SERVICOS_INICIAL.map(s => ({
      ...s,
      valorDiario: padroesRef.current.servicos[s.codigo] != null ? padroesRef.current.servicos[s.codigo] : s.valorDiario
    })));
    setBdi(padroesRef.current.bdi || 0);
    setAba('catalogo');
  };
  const salvarComoPadrao = async () => {
    const servicosPadrao = servicos.map(s => ({
      codigo: s.codigo,
      valorDiario: s.valorDiario
    }));
    const mapaValores = {};
    servicosPadrao.forEach(s => {
      mapaValores[s.codigo] = s.valorDiario;
    });
    padroesRef.current = {
      servicos: mapaValores,
      bdi
    };
    const ok = await salvarDado(CHAVE_PADROES, {
      servicos: servicosPadrao,
      bdi
    });
    if (ok) {
      avisar('sucesso', 'Valores de diária e BDI salvos como padrão para novas propostas.');
    } else {
      avisar('erro', 'Não consegui salvar os padrões. Tente novamente.');
    }
  };
  const exportar = () => {
    if (proposta.length === 0 && totalServicos === 0) return avisar('erro', 'Adicione itens ou serviços.');
    const linhas = [`PROPOSTA ${numProposta || 'sem numero'}`, `Data: ${hoje()}`, '', 'ITENS', 'Marca,Descricao,Origem,Qtd,Un,Total', ...planoCompras.map(p => {
      const origem = [p.usarDoEstoque > 0 ? `estoque ${p.usarDoEstoque}` : '', ...p.linhas.filter(l => l.qtd > 0).map(l => `${l.local} ${l.qtd}`)].filter(Boolean).join(' + ');
      return `${p.marca || ''},"${p.descricao}","${origem}",${p.quantidade},${p.unidade},${p.custoItem.toFixed(2)}`;
    }), '', 'SERVICOS', 'Profissional,Diaria,Dias,Total', ...servicos.filter(s => s.dias > 0).map(s => `${s.descricao},${s.valorDiario.toFixed(2)},${s.dias},${(s.valorDiario * s.dias).toFixed(2)}`), '', `SUBTOTAL ITENS,,,${totalItens.toFixed(2)}`, `SUBTOTAL SERVICOS,,,${totalServicos.toFixed(2)}`, `SUBTOTAL GERAL,,,${subtotal.toFixed(2)}`];
